<!DOCTYPE html>
<html>
<head>
<title>BEDROCKFITS - Free Boy Skins</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundled.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0}
.header{background:linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://wallpapers.com/images/hd/minecraft-background-cwsbyz7a9gouh69k.jpg');background-size:cover;padding:50px 20px;text-align:center;border-bottom:6px solid #5aaa2f}
.header h1{font-family:'Press Start 2P';font-size:20px;text-shadow:3px 3px 0 #000;margin:0}
.grid{display:flex;flex-wrap:wrap;justify-content:center;padding:20px;gap:15px}
.card{background:#1e1e1e;width:170px;border-radius:12px;padding:10px;text-align:center;border:2px solid #333}
.card canvas{width:150px!important;height:180px!important;margin:auto;display:block}
.card h3{font-size:13px;margin:8px 0}
.btn{display:block;background:#5aaa2f;color:#fff;padding:10px;border:2px solid #000;box-shadow:inset -3px -3px 0 #3d6e20, inset 3px 3px 0 #8ed35a;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1>BEDROCKFITS</h1><p>⛏️ 3D Preview Skins ⛏️</p></div>
<div class="grid">
<div class="card"><canvas id="c1"></canvas><h3>Skin 01</h3><a class="btn" href="./boy1.png" download>Download</a></div>
<div class="card"><canvas id="c2"></canvas><h3>Skin 02</h3><a class="btn" href="./boy2.png" download>Download</a></div>
<div class="card"><canvas id="c3"></canvas><h3>Skin 03</h3><a class="btn" href="./boy3.png" download>Download</a></div>
<div class="card"><canvas id="c4"></canvas><h3>Skin 04</h3><a class="btn" href="./boy4.png" download>Download</a></div>
<div class="card"><canvas id="c5"></canvas><h3>Skin 05</h3><a class="btn" href="./boy5.png" download>Download</a></div>
</div>
<script>
function show(id, skin){
  let viewer = new skinview3d.SkinViewer({canvas: document.getElementById(id), width:150, height:180, skin: skin});
  viewer.autoRotate=true; viewer.animation = new skinview3d.WalkingAnimation(); viewer.animation.speed=0.8;
}
show('c1','./boy1.png'); show('c2','./boy2.png'); show('c3','./boy3.png'); show('c4','./boy4.png'); show('c5','./boy5.png');
</script>
</body>
</html>
